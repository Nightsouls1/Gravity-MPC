name: Build MPC Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies & Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf

      - name: Clone SDK Correctly
        run: |
          if [ -d "sdk" ]; then rm -rf sdk; fi
          git clone https://github.com/inmusic-software/mpc-plugins-sdk.git sdk || { echo "Git clone failed"; exit 1; }

      - name: Run Build Tool
        run: |
          python sdk/tools/build.py plugins/Gravity

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-MPC-Plugin
          path: plugins/Gravity/build/
