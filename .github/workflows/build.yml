name: Build MPC Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies & Cross-Compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++-arm-linux-gnueabihf gcc-arm-linux-gnueabihf

      - name: Verify SDK Presence
        run: |
          if [ -d "sdk" ]; then
            echo "SDK map succesvol gedetecteerd in repository."
          else
            echo "Fout: De 'sdk' map ontbreekt in de repository root."
            exit 1
          fi

      - name: Run Build Tool
        run: |
          python sdk/tools/build.py plugins/Gravity

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-MPC-Plugin
          path: plugins/Gravity/build/
