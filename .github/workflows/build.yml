name: Build MPC Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Download SDK via Zip
        run: |
          curl -L https://github.com/inmusic-software/mpc-plugins-sdk/archive/refs/heads/main.zip -o sdk.zip
          unzip -q sdk.zip
          mv mpc-plugins-sdk-main sdk

      - name: Run Build Tool with Debug Output
        run: |
          python -u sdk/tools/build.py plugins/Gravity || exit 1

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-MPC-Plugin
          path: plugins/Gravity/build/
