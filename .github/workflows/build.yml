name: Build MPC Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone SDK
        run: |
          git clone https://github.com/inmusic-software/mpc-plugins-sdk.git sdk

      - name: Run Build Tool with Verbose Output
        run: |
          python sdk/tools/build.py plugins/Gravity --verbose || python sdk/tools/build.py plugins/Gravity

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-MPC-Plugin
          path: plugins/Gravity/build/
