name: Build MPC Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download or Check SDK
        run: |
          if [ -d "sdk" ]; then
            echo "SDK directory already exists."
          else
            git clone https://github.com/inmusic-software/mpc-plugins-sdk.git sdk || echo "Warning: SDK clone failed, check repository URL."
          fi

      - name: Run Build Script
        run: |
          if [ -f "sdk/tools/build.py" ]; then
            python sdk/tools/build.py plugins/Gravity
          else
            echo "Error: Build script not found in SDK folder."
            exit 1
          fi

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-MPC-Plugin
          path: plugins/Gravity/build/
